<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Launcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-alt {
            background: linear-gradient(135deg, #16a34a, #15803d);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎬 High-Speed Web Player</h1>
        <p>Aapki Video Play hone ke liye ready hai!</p>

        <a id="play-btn-1" href="#" target="_blank" class="btn">▶️ Play via Fast Engine</a>
        <a id="play-btn-2" href="#" target="_blank" class="btn btn-alt">🚀 Open via Terabox App/Web</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let teraboxUrl = urlParams.get('url');

        if (teraboxUrl) {
            // Engine 1: Terabox Web Direct Converter
            let cleanUrl = teraboxUrl.replace("1024terabox.com", "terabox.app")
                                    .replace("teraboxapp.com", "terabox.app")
                                    .replace("freeterabox.com", "terabox.app");
            
            document.getElementById('play-btn-1').href = cleanUrl;

            // Engine 2: Alternative Mirror Converter 
            let mirrorUrl = teraboxUrl.replace("1024terabox.com", "terabox.com");
            document.getElementById('play-btn-2').href = mirrorUrl;
        } else {
            document.querySelector('.card').innerHTML = "<h1>⚠️ Link Missing</h1><p>Kripya Bot se aaya hua link kholein.</p>";
        }
    </script>
</body>
</html>
