<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiskWala Video Streamer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎬 DiskWala Streamer</h1>
        <p>Aapki Video Stream hone ke liye ready hai!</p>

        <a id="play-btn" href="#" target="_blank" class="btn">▶️ Stream Video Now</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let diskwalaUrl = urlParams.get('url');

        if (diskwalaUrl) {
            document.getElementById('play-btn').href = diskwalaUrl;
        } else {
            document.querySelector('.card').innerHTML = "<h1>⚠️ Link Missing</h1><p>Kripya Bot se aaya hua link kholein.</p>";
        }
    </script>
</body>
</html>
