<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - HD Video Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: 0.2s;
        }
        .btn:hover { background: #0284c7; }
        .btn-dl {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎬 Video Web Streamer</h1>
        <p>Aapki Terabox Video Play hone ke liye ready hai!</p>

        <a id="play-btn" href="#" target="_blank" class="btn">▶️ Play Video Online</a>
        <a id="dl-btn" href="#" target="_blank" class="btn btn-dl">📥 Direct Download</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teraboxUrl = urlParams.get('url');

        if (teraboxUrl) {
            // High-speed bypass player engine
            const fastStream = "https://freeterabox.com/watch?url=" + encodeURIComponent(teraboxUrl);
            document.getElementById('play-btn').href = fastStream;
            document.getElementById('dl-btn').href = fastStream;
        } else {
            document.querySelector('.card').innerHTML = "<h1>⚠️ No URL Provided</h1><p>Kripya Bot se aaya hua link open karein.</p>";
        }
    </script>
</body>
</html>
